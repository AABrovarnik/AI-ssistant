services:
  db:
    image: postgres:16-alpine
    container_name: ai-secretary-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_secretary}
      POSTGRES_USER: ${POSTGRES_USER:-ai_secretary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_secretary} -d ${POSTGRES_DB:-ai_secretary}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-secretary-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_secretary}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_secretary}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-secretary-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_secretary}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_secretary}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.jobs.worker
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
